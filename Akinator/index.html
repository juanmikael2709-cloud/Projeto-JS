<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
  <title>Akinator de Profissões</title>
  <script src="akinator.js"></script>
  <link rel="stylesheet" href="/dist/output.css">
</head>
<body>
  <div id="card">
    <h1>Akinator das Profissões 🧞‍♂️</h1>

    <div id="jogo">
      <p id="pergunta-texto">Carregando jogo...</p>


      <div class="botoes">
        <button id="btn-sim" class="btn btn-sim">Sim</button>
        <button id="btn-nao" class="btn btn-nao">Não</button>
      </div>

      <div class="controles">
        <button id="btn-desfazer" class="btn-secundario">↩ Voltar atrás</button>
      </div>
    </div>

    <div id="resultado" class="escondido">

      <h2 class="resultado-titulo"></h2>
      <p class="resultado-detalhe"></p>
      <button id="btn-reiniciar" class="btn btn-reiniciar">Jogar Novamente</button>
    </div>
  </div>
  

  
</body>
</html>
